name: Data update

on:
  schedule:
    # Backup only: GitHub's scheduler is best effort (often late, sometimes skipped).
    # The on-time trigger is the Cloudflare Worker in worker/volstrat-refresh.js,
    # which dispatches this workflow at 23:20, 01:20, 03:20 and 11:20 UTC.
    - cron: "30 23 * * 1-5"
    - cron: "15 11 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write # keep the schedule enabled (below)

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Fetch and build
        id: run
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -o pipefail
          if volstrat update 2>&1 | tee update.log; then
            echo "failed=0" >> "$GITHUB_OUTPUT"
          else
            echo "failed=1" >> "$GITHUB_OUTPUT"
          fi
          {
            echo '### Source status'
            echo '```'
            grep -E '^\[|^ +!' update.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Same TypeScript engine as the site: latest.json, regime_history.json, feed.xml
      - name: Daily signal snapshot
        id: signal
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run signal

      # Every file written has passed the storage guards, so partial updates are
      # safe to commit even when a required source failed.
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Keep schedule alive
        # GitHub disables scheduled workflows after 60 days without repository
        # activity; re-enabling resets the timer (same as interestcal).
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/data-update.yml/enable"

      - name: Notify regime change
        if: steps.signal.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.signal.outputs.title }}
          BODY: ${{ steps.signal.outputs.body }}
        run: |
          gh issue create --title "$TITLE" --body "$BODY" --label regime-change

      - name: Report failure
        if: always() && (steps.run.outputs.failed == '1' || failure())
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(printf 'Run: %s/%s/actions/runs/%s\n\n```\n%s\n```' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$(grep -E '^\[|^ +!|failed' update.log 2>/dev/null | tail -40)")
          # one open issue per outage: comment on it instead of opening duplicates
          open=$(gh issue list --label data-failure --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Still failing $(date -u +%Y-%m-%dT%H:%MZ). $body"
          else
            gh issue create --title "Data update failing since $(date -u +%Y-%m-%d)" --body "$body" --label data-failure
          fi
          exit 1

      - name: Close resolved failure issue
        if: success() && steps.run.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label data-failure --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Resolved by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
